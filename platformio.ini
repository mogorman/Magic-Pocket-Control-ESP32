; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-core2

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = 
	arduino-libraries/Arduino_DebugUtils@^1.4.0
build_src_filter = 
	-<.git/>
	+<BLE/>
	+<Camera/>
	+<CCU/>
	+<Config/>
	+<ESP32/>
	+<Images/>
	+<main/main-${PIOENV}.cpp>

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
lib_deps = 
	${env.lib_deps}
	bodmer/TFT_eSPI@^2.5.23
	mathertel/OneButton@^2.0.3
build_src_filter = 
	${env.build_src_filter}
	+<BLE_TFT_eSPI/>

[env:m5stick-c]
platform = espressif32
board = m5stick-c
board_build.partitions = huge_app.csv
lib_deps = 
	${env.lib_deps}
	m5stack/M5StickCPlus@^0.0.8

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
lib_deps = 
	${env.lib_deps}

[env:m5stack-cores3-mpc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = ./src/Boards/M5CoreS3/partitions_ffat.csv
build_flags = 
	-std=c++11
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
 	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-DLCD_HEIGHT=240
	-DLCD_WIDTH=320
	-DLV_TICK_PERIOD_MS=10
	-DMONKEY_TEST_ENABLE=0
lib_deps = 
	${env.lib_deps}
	m5stack/M5GFX@^0.1.7
	lvgl/lvgl@^8.3.7
build_src_filter = 
	${env.build_src_filter}
	+<Boards/M5CoreS3/>
	+<BLE_M5GFX/>
	+<Fonts/>

[env:m5stack-grey]
platform = espressif32
board = m5stack-grey
board_build.partitions = huge_app.csv
build_flags = 
	-std=c++11
	-DCORE_DEBUG_LEVEL=0
lib_deps = 
	${env.lib_deps}
	tobozo/ESP32-Chimera-Core @ ^1.4.9
build_src_filter = 
	${env.build_src_filter}
	+<BLE_M5GREY/>
	+<Fonts/>

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
board_build.partitions = huge_app.csv
build_flags =
	-std=c++11
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM
lib_deps =
	${env.lib_deps}
	m5stack/M5GFX@^0.1.7
	m5stack/M5Unified@0.1.7
	greiman/SdFat@^2.3.1
build_src_filter =
	${env.build_src_filter}
	+<BLE_M5GREY/>
	+<Fonts/>
	+<GyroLog/>

[env:waveshare]
; Waveshare ESP32-S3-Touch-LCD-1.54 (1.54" ST7789 240x240 SPI LCD, CST816T
; touch, QMI8658 IMU, no AXP2101 PMU, 3 buttons).
;   https://docs.waveshare.com/ESP32-S3-Touch-LCD-1.54
; Pinned to the same platform version the local build uses. The shared
; ~/.platformio cache can be polluted by other projects (e.g. the pioarduino
; 53.03.13 platform from the claude-buddy reference), which changes the
; Arduino-BLE API and breaks the build. Pinning avoids that.
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
; The ESP32 image header's flash size comes from the board config's
; upload.flash_size (NOT board_build.flash_size). The stock board default is
; 8MB, but the 1.54 has 16MB QIO flash. An 8MB image on a 16MB flash makes the
; ROM's SHA-256 check fail -> boot loop. Override upload.flash_size to 16MB so
; the image header matches the hardware. (PlatformIO maps ini 'board_upload.*'
; to the board config 'upload.*' namespace.)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = huge_app.csv
; ESP32-S3R8 has 8MB OPI PSRAM. Must be OPI (not QSPI) or the PSRAM ID read
; fails (0x00ffffff).
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
build_flags =
	-std=c++11
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLCD_WIDTH=240
	-DLCD_HEIGHT=240
lib_deps =
	${env.lib_deps}
	greiman/SdFat@^2.3.1
	mathertel/OneButton@^2.0.3
	m5stack/M5GFX@^0.1.7
build_src_filter =
	${env.build_src_filter}
	+<Boards/WaveshareS3/>
	+<BLE_M5GFX/>
	+<GyroLog/>
	+<ESP32/>

; Accepts commands through TouchDesigner - serial connection
[env:m5stack-grey-touchdesigner]
platform = espressif32
board = m5stack-grey
board_build.partitions = huge_app.csv
build_flags = 
	-std=c++11
	-DCORE_DEBUG_LEVEL=0
lib_deps = 
	${env.lib_deps}
	tobozo/ESP32-Chimera-Core @ ^1.4.9
build_src_filter = 
	${env.build_src_filter}
	+<BLE_M5GREY/>
	+<Fonts/>


platform_packages = 
	tool-esptoolpy @ ~1.40300.0